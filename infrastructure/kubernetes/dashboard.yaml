apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: x402
  labels:
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/part-of: x402
spec:
  selector:
    app.kubernetes.io/name: dashboard
  ports:
    - name: http
      port: 3001
      targetPort: http
---
# Dashboard Deployment.
#
# Image: published by .github/workflows/deploy.yml on version tags as
# x402/dashboard:latest and x402/dashboard:<version>. Pin a specific version
# tag in production instead of `latest`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: x402
  labels:
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/part-of: x402
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dashboard
        app.kubernetes.io/part-of: x402
    spec:
      containers:
        - name: dashboard
          image: x402/dashboard:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: x402-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 60
