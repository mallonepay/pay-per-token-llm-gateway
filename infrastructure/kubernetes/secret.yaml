# Sensitive configuration for the x402 stack.
#
# ⚠️ PLACEHOLDERS — replace every value below before applying to a real
# cluster. Generate strong secrets with:
#   openssl rand -base64 32          # JWT_SECRET, POSTGRES_PASSWORD, REDIS_PASSWORD
# and set CONTRACT_ADMIN_SECRET to the S… secret key of the contract admin,
# and PAYMENT_VERIFIER_CONTRACT / CREDIT_ESCROW_CONTRACT / MULTISIG_CONTRACT
# to the deployed contract IDs (see contracts/deployed-addresses.json).
#
# stringData is used so values can be written in plaintext; Kubernetes
# base64-encodes them at apply time. Never commit real secrets.
apiVersion: v1
kind: Secret
metadata:
  name: x402-secrets
  namespace: x402
  labels:
    app.kubernetes.io/name: x402-gateway
    app.kubernetes.io/part-of: x402
type: Opaque
stringData:
  # ── Database / cache ────────────────────────────────────
  # Keep POSTGRES_PASSWORD in sync with the password embedded in DATABASE_URL.
  POSTGRES_PASSWORD: CHANGE_ME_openssl_rand_base64_32
  REDIS_PASSWORD: CHANGE_ME_openssl_rand_base64_32
  DATABASE_URL: postgresql://x402:CHANGE_ME_openssl_rand_base64_32@postgres:5432/x402_gateway
  REDIS_URL: redis://:CHANGE_ME_openssl_rand_base64_32@redis:6379

  # ── Gateway auth ────────────────────────────────────────
  JWT_SECRET: CHANGE_ME_openssl_rand_base64_32

  # ── Stellar contract admin (mainnet: real funds, handle with care) ──
  CONTRACT_ADMIN_SECRET: CHANGE_ME_S_secret_key
  PAYMENT_VERIFIER_CONTRACT: CHANGE_ME_contract_id
  CREDIT_ESCROW_CONTRACT: CHANGE_ME_contract_id
  MULTISIG_CONTRACT: CHANGE_ME_contract_id

  # ── Upstream LLM providers ──────────────────────────────
  # One entry per provider, matching the UPSTREAM_API_KEY_{PROVIDER_ID}
  # convention (e.g. UPSTREAM_API_KEY_openai=sk-…).
  UPSTREAM_API_KEY_openai: CHANGE_ME_sk_key
