# Copy to secret.yaml and fill before first apply — DO NOT COMMIT secret.yaml
# Or use: kubectl create secret generic x402-secrets --from-literal=JWT_SECRET=$(openssl rand -hex 32) --from-literal=DATABASE_URL=postgresql://x402:YOURPASS@postgres:5432/x402_gateway -n x402-gateway
apiVersion: v1
kind: Secret
metadata:
  name: x402-secrets
  namespace: x402-gateway
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_ME_openssl_rand_-hex_32"
  DATABASE_URL: "postgresql://x402:REPLACE_ME@postgres:5432/x402_gateway"
  POSTGRES_PASSWORD: "REPLACE_ME"
