name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Pinned to an exact version: floating '11' resolved to a pnpm release that
  # requires Node >= 22.13, which crashed on the then-pinned Node 20 runners
  # (ERR_UNKNOWN_BUILTIN_MODULE: node:sqlite). Keep in sync with the
  # `packageManager` field in package.json and .nvmrc (Node 22+).
  PNPM_VERSION: '11.24.0'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read Node version from .nvmrc
        id: nvm
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nvm.outputs.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec nx run-many --target=lint --all

  # The pitch video is the project's primary presentation, so its narration is
  # kept honest the same way the code is: every cue is measured against the
  # scene budget it is spoken over. This job needs no dependencies — the check
  # is pure Node — and fails the build if any cue would overrun its scene.
  video-narration:
    name: Video Narration Timing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read Node version from .nvmrc
        id: nvm
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nvm.outputs.NODE_VERSION }}

      - name: Check narration cues fit their scene budgets
        run: node video/make-voiceover.mjs --check

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: x402_gateway_test
          POSTGRES_USER: x402
          POSTGRES_PASSWORD: x402_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read Node version from .nvmrc
        id: nvm
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nvm.outputs.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run database:generate
      # --coverage so jest coverageThreshold is enforced (fails on coverage regressions)
      - run: pnpm exec nx run-many --target=test --all --coverage
        env:
          DATABASE_URL: postgresql://x402:x402_test@localhost:5432/x402_gateway_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test

  schema-drift:
    name: Prisma Schema Drift
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: x402_drift
          POSTGRES_USER: x402
          POSTGRES_PASSWORD: x402_drift
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U x402"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Read Node version from .nvmrc
        id: nvm
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nvm.outputs.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # The backup/restore drill proves a fresh `migrate deploy` creates the
      # tables the seed touches, but it cannot see index-level drift. The
      # `Payment` single-use constraint was declared as `@@unique([txHash])`
      # while the migration created only a PARTIAL index, so `db push` and
      # `migrate deploy` produced different databases and `migrate diff`
      # reported permanent drift (fixed 2026-09-13). This job makes that
      # class of bug impossible to reintroduce.
      - name: Apply migrations to a fresh database
        working-directory: packages/database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://x402:x402_drift@localhost:5432/x402_drift

      - name: Assert schema.prisma matches the migration history
        working-directory: packages/database
        run: |
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code
        env:
          DATABASE_URL: postgresql://x402:x402_drift@localhost:5432/x402_drift

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read Node version from .nvmrc
        id: nvm
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nvm.outputs.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run database:generate
      # The e2e suite is fully self-contained (mocks @x402/database + ioredis
      # and overrides the REDIS/PRISMA providers), so no Postgres/Redis
      # services are required. --coverage enforces the e2e coverageThreshold.
      - run: pnpm exec nx run gateway:test:e2e --coverage
        env:
          NODE_ENV: test

  backup-restore:
    name: Backup/Restore Drill
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: x402_gateway
          POSTGRES_USER: x402
          POSTGRES_PASSWORD: x402_drill
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U x402"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Read Node version from .nvmrc
        id: nvm
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nvm.outputs.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # The drill proves the documented recovery path (OPERATIONS.md §2.1)
      # every run: real migrations → seed → pg_dump → pg_restore into a
      # FRESH database → table/row/sample parity. It also fails when the
      # schema drifts from the migration history (a fresh `migrate deploy`
      # must produce the full schema — this is what caught the missing
      # UnderpaymentDebt migration in 2026-09-09).
      - name: Create source + target databases
        run: |
          docker run --rm --network host postgres:16-alpine \
            psql "postgresql://x402:x402_drill@127.0.0.1:5432/postgres" -v ON_ERROR_STOP=1 -c \
            'CREATE DATABASE x402_drill_source;' -c 'CREATE DATABASE x402_drill_target;'

      - name: Run backup/restore drill
        run: bash scripts/backup-restore-drill.sh
        env:
          DRILL_SOURCE_URL: postgresql://x402:x402_drill@127.0.0.1:5432/x402_drill_source
          DRILL_TARGET_URL: postgresql://x402:x402_drill@127.0.0.1:5432/x402_drill_target

  quickstart-env:
    name: Verify .env Quickstart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read Node version from .nvmrc
        id: nvm
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nvm.outputs.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Reproduce the documented quickstart exactly: copy the example env file,
      # fill in a real JWT_SECRET, and assert the gateway config loads from it.
      # Guards against regressions in @x402/config .env loading.
      #
      # The template ships dev defaults (NODE_ENV=development, localhost
      # Redis), which validateEnv() rightly rejects under NODE_ENV=production.
      # To exercise the production path we replace the localhost REDIS_URL the
      # way an operator would before deploy, then assert .env → config loads.
      - name: Create .env from example with a real JWT_SECRET
        run: |
          cp .env.example .env
          sed -i "s|^JWT_SECRET=$|JWT_SECRET=$(openssl rand -base64 32)|" .env
          sed -i "s|^REDIS_URL=redis://localhost:6379|REDIS_URL=redis://prod-redis.internal:6379|" .env

      - name: Assert gateway config validates from .env
        run: |
          NODE_ENV=production node -r ts-node/register -e "
            const { validateEnv, loadConfig } = require('./packages/config/src/index.ts');
            validateEnv();
            const c = loadConfig();
            if (!c.security.jwtSecret || c.security.jwtSecret.length < 20) {
              throw new Error('JWT_SECRET was not loaded from .env');
            }
            console.log('OK: .env loaded and gateway config valid');
          "

  contracts:
    name: Build & Test Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: wasm32v1-none

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/*/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/**/Cargo.toml') }}

      # `cargo test` runs the full unit matrix INCLUDING the gas/storage
      # benchmarks (src/bench.rs in each contract) — their assertions gate
      # the O(1)-in-history invariant (flat fee + flat entry counts) and the
      # bounded pagination reads, so a regression fails the build.
      - name: Test payment-verifier (incl. gas/storage benches)
        run: cd contracts/payment-verifier && cargo test

      - name: Test credit-escrow (incl. gas/storage benches)
        run: cd contracts/credit-escrow && cargo test

      - name: Test multisig (incl. gas/storage benches)
        run: cd contracts/multisig && cargo test

      # Contract size gate: Soroban deploy limit is 64 KiB per contract.
      # Build the actual WASM artifacts and fail if any exceeds the limit
      # (with headroom — the current artifacts are all < 10 KiB).
      - name: Build WASM artifacts
        run: |
          for c in payment-verifier credit-escrow multisig; do
            (cd contracts/$c && cargo build --release --target wasm32v1-none)
          done

      # One implementation of the gate, shared with `pnpm build:contracts` and
      # scripts/deploy-contracts.sh, so the limit cannot drift between CI and
      # what actually ships. It also fails when an artifact is missing entirely,
      # which a bare glob-and-stat loop could only express as collateral damage.
      - name: Enforce contract size gate (< 64 KiB deploy limit)
        run: bash scripts/check-contract-sizes.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read Node version from .nvmrc
        id: nvm
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nvm.outputs.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run database:generate
      - run: pnpm exec nx run-many --target=build --all

  # Mirrors Vercel's production build so deploy-breaking regressions are caught
  # on every push/PR before they reach the deploy pipeline.
  #
  # Vercel's project Root Directory is `apps/dashboard` and the build command
  # (apps/dashboard/vercel.json) is `pnpm exec next build`. The Nx
  # `@nx/next:build` executor fails when invoked from that subdirectory with a
  # cold cache (ENOENT: scandir 'apps/dashboard/public'), which broke deploys.
  # The root-level `build` job above cannot catch that failure mode, so this
  # job runs the app build from the exact directory + command Vercel uses.
  vercel-build:
    name: Vercel Build Check (apps/dashboard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read Node version from .nvmrc
        id: nvm
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nvm.outputs.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Fresh runners have no Nx/Next cache; rm -rf .next keeps this explicitly
      # on the cold-cache path Vercel hits on every deploy.
      - name: Build dashboard from apps/dashboard (cold cache, as Vercel does)
        working-directory: apps/dashboard
        run: |
          rm -rf .next
          pnpm exec next build

  kubernetes:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4
        with:
          version: 'v1.31.0'

      # Renders the kustomize set exactly as `kubectl apply -k` would — fails
      # on invalid YAML, duplicate resources, or broken cross-references.
      - name: Render manifests (kubectl kustomize)
        run: kubectl kustomize infrastructure/kubernetes > rendered.yaml

      # Static schema validation against the Kubernetes API schemas. Catches
      # misspelled fields and wrong apiVersions without needing a cluster.
      # The binary is pinned and its SHA-256 verified against the release's own
      # CHECKSUMS file.
      - name: Install kubeconform (pinned + checksum-verified)
        run: |
          VERSION=v0.8.0
          BASE="https://github.com/yannh/kubeconform/releases/download/${VERSION}"
          curl -sSLo /tmp/kubeconform.tar.gz "${BASE}/kubeconform-linux-amd64.tar.gz"
          curl -sSLo /tmp/CHECKSUMS "${BASE}/CHECKSUMS"
          expected=$(grep 'kubeconform-linux-amd64.tar.gz' /tmp/CHECKSUMS | grep -oE '[a-f0-9]{64}' | head -1)
          actual=$(sha256sum /tmp/kubeconform.tar.gz | cut -d' ' -f1)
          if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
            echo "::error::kubeconform checksum verification failed (expected '$expected', got '$actual')"
            exit 1
          fi
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Validate against Kubernetes schemas (kubeconform)
        run: kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.31.0 rendered.yaml

      # Behavioural invariants the render alone can't prove: readiness gating,
      # PDB coverage, NetworkPolicies, and resolvable ServiceAccount refs.
      - name: Assert manifest invariants
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 scripts/validate-kubernetes.py rendered.yaml

  dashboard-build-arg:
    name: Dashboard Build-Arg Inlining
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Next.js inlines NEXT_PUBLIC_* into the client bundle at BUILD time. If
      # the Dockerfile's ARG/ENV wiring ever slips below the build step, the
      # image silently ships the fallback URL and the deployed dashboard points
      # at the wrong gateway. Build the image with a distinctive URL and assert
      # it landed in the bundle.
      #
      # The FULL image is built deliberately (no `--target builder`). Stopping
      # at the builder stage never executes the production stage, so its COPY
      # paths and CMD went unverified — which is how the dashboard image came
      # to be unbuildable while this job still reported on the bundle.
      - name: Build the dashboard image with a probe URL
        run: |
          docker build \
            --file infrastructure/docker/Dockerfile.dashboard \
            --build-arg NEXT_PUBLIC_GATEWAY_URL=https://gw-arg-probe.invalid \
            --tag x402-dashboard-probe:ci \
            .

      - name: Assert the probe URL was inlined into the CLIENT bundle
        run: |
          set -euo pipefail
          docker create --name probe x402-dashboard-probe:ci
          rm -rf /tmp/probe-static
          mkdir -p /tmp/probe-static
          # Assert on the *client* assets only (/app/apps/dashboard/.next/static
          # is the tree the production stage serves — see the COPY lines in
          # infrastructure/docker/Dockerfile.dashboard). Next.js inlines only the
          # literal expression `process.env.NEXT_PUBLIC_*` into the browser
          # bundle. The server-side manifests (routes-manifest.json,
          # required-server-files.json, server.js) always contain the value
          # because next.config.js reads the real process env at build time, so
          # grepping all of .next — as this job used to — passed even when the
          # client shipped the localhost fallback. That false pass is how the
          # deployed dashboard ended up calling localhost:3000 while CI stayed
          # green.
          docker cp probe:/app/apps/dashboard/.next/static /tmp/probe-static
          docker rm -f probe
          if grep -rq "gw-arg-probe.invalid" /tmp/probe-static; then
            echo "OK: NEXT_PUBLIC_GATEWAY_URL was inlined into the client bundle"
          else
            echo "::error::NEXT_PUBLIC_GATEWAY_URL was not inlined into the client bundle — check the ARG/ENV placement in Dockerfile.dashboard and that the dashboard reads it as the literal expression process.env.NEXT_PUBLIC_GATEWAY_URL (see apps/dashboard/src/lib/gatewayUrl.ts)"
            exit 1
          fi

  gateway-image:
    name: Gateway Image Smoke Test
    runs-on: ubuntu-latest
    services:
      # The gateway refuses to boot without Postgres + Redis, and readiness
      # exercises both (SELECT 1 through Prisma, PING through ioredis).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: x402_gateway
          POSTGRES_USER: x402
          POSTGRES_PASSWORD: x402_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U x402"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # Builds BOTH stages of the real production artifact. A build failure here
      # is the Node/pnpm guard (the image was unbuildable on node:20 + pnpm 11).
      - name: Build the gateway image
        run: |
          docker build \
            --file infrastructure/docker/Dockerfile.gateway \
            --tag x402-gateway:ci \
            .

      # Apply the schema with the SAME command the k8s migration Job uses —
      # this is the only place that path is exercised. It was broken: the Prisma
      # CLI lives in the workspace package's .bin (pnpm isolated layout), not
      # the root node_modules, so `npx --no-install prisma` found no local CLI
      # and tried to download Prisma from the network instead of applying the
      # shipped migrations.
      - name: Apply migrations (as the k8s migration Job does)
        run: |
          docker run --rm --network host --add-host db.internal:127.0.0.1 \
            -w /app/packages/database \
            -e DATABASE_URL="postgresql://x402:x402_dev_password@db.internal:5432/x402_gateway" \
            --entrypoint npx x402-gateway:ci \
            --no-install prisma migrate deploy --schema prisma/schema.prisma

      # Boot the production image against real Postgres + Redis. The container
      # uses the host network so it can reach the service containers on
      # 127.0.0.1; the *.internal aliases keep it off the literal
      # localhost/127.0.0.1 strings the production config guard rejects.
      - name: Boot the gateway container
        run: |
          docker run -d --name x402-gw --network host \
            --add-host db.internal:127.0.0.1 \
            --add-host redis.internal:127.0.0.1 \
            -e NODE_ENV=production \
            -e JWT_SECRET="$(openssl rand -base64 32)" \
            -e DATABASE_URL="postgresql://x402:x402_dev_password@db.internal:5432/x402_gateway" \
            -e REDIS_URL="redis://redis.internal:6379" \
            -e STELLAR_NETWORK=testnet \
            -e PORT=3000 -e HOST=127.0.0.1 \
            x402-gateway:ci

      # /health/ready runs `SELECT 1` through Prisma, so a 200 proves the query
      # engine actually loads — the exact failure mode of the Prisma/OpenSSL
      # Docker defect, which the container previously hit at boot.
      - name: Assert the gateway boots and reaches readiness
        run: |
          set -e
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000/health/live >/dev/null 2>&1 && break
            sleep 2
          done
          curl -sf http://127.0.0.1:3000/health/live
          curl -sf http://127.0.0.1:3000/health/ready
          echo "OK: gateway booted and reached readiness"

      - name: Assert the container runs as non-root
        run: test "$(docker exec x402-gw id -u)" != "0"

      - name: Gateway container logs (on failure)
        if: failure()
        run: docker logs x402-gw 2>&1 | tail -50 || true

  security:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read Node version from .nvmrc
        id: nvm
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nvm.outputs.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      # Fail the build on any critical advisory. The last runtime-reachable
      # advisories were resolved by the NestJS 11 / Next 15 major upgrades and
      # the nx 22 migration (2026-09-08); the remainder are dev/build-tooling
      # only — 2 high `image-size` (no patched release at any version; the
      # unused @nx/vite → less chain) and 1 moderate `adm-zip` (no patched
      # release; @module-federation's build-time dts plugin) — and each is
      # listed with its reason in .osv-scanner.toml, tracked in
      # MAINNET_READINESS.md §7. Reachable runtime advisories in the gateway
      # tree (express, ws, body-parser, qs, …) stay pinned via overrides in
      # pnpm-workspace.yaml.
      - run: pnpm audit --audit-level=critical
      - name: Report full advisory summary (non-blocking)
        run: pnpm audit --audit-level=high || true

  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Scans the full commit history for leaked secrets (API keys, private
      # keys, Stellar secrets) and fails the build when one is found.
      # gitleaks/gitleaks-action@v2 requires a paid GITLEAKS_LICENSE for
      # organization repositories, so run the OSS CLI (MIT) directly instead.
      # Scans the full commit history; fails on any real leak. The only
      # findings are documented test/doc fixtures, whitelisted in
      # .gitleaksignore.
      - name: Run gitleaks
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --redact=100 --verbose --exit-code 1

  trivy:
    name: Vulnerability Scan (trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # for SARIF upload to the Security tab
    steps:
      - uses: actions/checkout@v4

      # Filesystem scan (lockfiles + manifests + source). HIGH/CRITICAL only,
      # and Trivy suppresses dev dependencies by default, so what lands here is
      # runtime-reachable. Findings go to the GitHub Security tab via SARIF.
      # Clean as of 2026-09-13; the dev-only residuals (image-size, adm-zip)
      # are gated by the osv-scanner job instead, which scans the full lockfile.
      # v0.28.0 is broken upstream (it references the nonexistent
      # aquasecurity/setup-trivy@v0.2.1); v0.36.0 pins setup-trivy by full SHA
      # to v0.2.6, which exists.
      - name: Run Trivy (fs)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: '0'
          skip-dirs: node_modules,dist,.next,coverage,.git

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  osv-scanner:
    name: Dependency Scan (osv-scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Scans every lockfile (pnpm-lock.yaml, python/uv.lock and the three
      # contracts/*/Cargo.lock) against the OSV database — including dev
      # dependencies, which the Trivy fs scan suppresses.
      #
      # This is a GATE, not a report: osv-scanner exits 1 on any finding, so an
      # advisory that is not explicitly reviewed fails the build. The reviewed
      # exceptions live in .osv-scanner.toml with a reason and an expiry date
      # (advisories with no patched release, and the crates pinned by the
      # Soroban SDK the contracts build against — see MAINNET_READINESS §7).
      # The exit code used to be swallowed with `|| true`, which is exactly how
      # the open-alert count grew unnoticed.
      - name: Run OSV scanner
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" -w /repo \
            ghcr.io/google/osv-scanner-action:v2.5.1 scan source --recursive \
            --config /repo/.osv-scanner.toml ./

  dast:
    name: DAST (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    services:
      # The gateway requires live Postgres + Redis to boot; the ZAP baseline
      # then exercises every unauthenticated endpoint (health, metrics,
      # swagger, docs, 401/402 paths) the way an external attacker would.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: x402_gateway
          POSTGRES_USER: x402
          POSTGRES_PASSWORD: x402_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U x402"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Read Node version from .nvmrc
        id: nvm
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nvm.outputs.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run database:generate

      # Build the tsc output + esbuild bundle (the same artifact the Docker
      # image runs), then boot it against the service containers.
      - run: pnpm exec nx build gateway

      # The gateway's boot-time schema guard refuses to start against a database
      # with no migration history (see apps/gateway/src/common/schema-guard.ts).
      # Without this the process exits before binding — correctly — and the
      # readiness curl below fails with an opaque `exit code 7`.
      - name: Apply migrations
        env:
          DATABASE_URL: postgresql://x402:x402_dev_password@127.0.0.1:5432/x402_gateway
        run: pnpm exec nx run database:migrate:deploy

      - name: Start gateway (bundle) against dockerized Postgres/Redis
        env:
          NODE_ENV: development
          JWT_SECRET: dast-scan-jwt-secret-0123456789abcdef
          DATABASE_URL: postgresql://x402:x402_dev_password@127.0.0.1:5432/x402_gateway
          REDIS_URL: redis://127.0.0.1:6379
          PORT: '3000'
          HOST: 127.0.0.1
          NODE_PATH: /home/runner/work/pay-per-token-llm-gateway/pay-per-token-llm-gateway/packages/database/node_modules:/home/runner/work/pay-per-token-llm-gateway/pay-per-token-llm-gateway/node_modules
        run: |
          node dist/apps/gateway/main.js > /tmp/gateway.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/health/live > /dev/null && break
            sleep 2
          done
          # Surface the gateway's own output on failure; otherwise a boot crash
          # is reported as a bare curl exit code with no cause.
          if ! curl -sf http://127.0.0.1:3000/health/ready; then
            echo "::error::gateway never became ready — gateway log follows"
            cat /tmp/gateway.log
            exit 1
          fi

      # OWASP ZAP baseline: passive + active-lite scan of the booted gateway.
      #
      # This step must FAIL LOUDLY when it does not run. It used to carry
      # `continue-on-error: true` and hand every file-writing option an
      # absolute path, but ZAP requires the directory that holds those files
      # to be mounted at /zap/wrk — without the `-v` below it printed its own
      # usage text and exited 3 *before scanning anything*, while the job
      # still reported success. The DAST gate had never once executed.
      #
      # Findings stay report-only (they land in the artifact and the run log);
      # the hard security gates remain the pnpm audit (critical) and gitleaks
      # jobs. What is enforced here is that the scan actually RAN. Verified
      # 2026-09-15 against the real gateway: FAIL-NEW 0 / WARN-NEW 0 / PASS 66.
      - name: Run OWASP ZAP baseline scan
        run: |
          mkdir -p "$GITHUB_WORKSPACE/zap-reports"
          # ZAP runs as uid 1000 inside the image (the `zap` user), which is not
          # the runner's uid, so a 755 mount owned by the runner is not
          # writable and ZAP dies with `[Errno 13] Permission denied`.
          chmod 0777 "$GITHUB_WORKSPACE/zap-reports"
          docker run --rm --network host -t \
            -v "$GITHUB_WORKSPACE/zap-reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://127.0.0.1:3000/ \
            -r report-dast.html \
            -J report-dast.json \
            -I \
            -l WARN

      # ZAP's automation framework exits 0 even when it reports "Job report
      # failed to generate report", so the exit code alone is not evidence the
      # scan worked. Assert the reports exist — a scan that produced nothing
      # must not pass as a scan that did.
      - name: Assert the DAST reports were written
        run: |
          set -euo pipefail
          for f in "$GITHUB_WORKSPACE/zap-reports/report-dast.json" \
                   "$GITHUB_WORKSPACE/zap-reports/report-dast.html"; do
            if [ ! -s "$f" ]; then
              echo "::error::DAST wrote no $f — the scan did not run (is /zap/wrk mounted?)"
              exit 1
            fi
          done
          echo "OK: DAST produced both reports"

      - name: Upload DAST report
        uses: actions/upload-artifact@v4
        with:
          name: dast-report
          path: ${{ github.workspace }}/zap-reports/report-dast.*
