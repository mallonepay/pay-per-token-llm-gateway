apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: x402
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: x402
spec:
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 3000
      targetPort: http
---
# Gateway Deployment.
#
# Image: published by .github/workflows/deploy.yml on version tags as
# x402/gateway:latest and x402/gateway:<version>. Pin a specific version tag
# in production instead of `latest`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: x402
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: x402
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/part-of: x402
    spec:
      containers:
        - name: gateway
          image: x402/gateway:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: x402-config
            - secretRef:
                name: x402-secrets
          # NOTE: the gateway image does NOT run Prisma migrations on boot
          # (CMD is `node dist/apps/gateway/main.js`). Apply the schema once
          # before scaling the Deployment:
          #   kubectl apply -f migrations-job.yaml   # runs `prisma migrate deploy`
          # Re-run the Job after every upgrade that ships a new migration.
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 60 # allow up to ~5 min for migrations on first boot
