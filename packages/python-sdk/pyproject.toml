[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "x402-sdk"
version = "0.1.0"
description = "Python client SDK for x402 LLM Gateway with Stellar payments and LangChain integration"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "x402 LLM Gateway contributors" }]
dependencies = [
  "httpx>=0.27",
  "stellar-sdk>=12.3",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.2"]
dev = ["pytest>=8", "respx>=0.21", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["x402_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

