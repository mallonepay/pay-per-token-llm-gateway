apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: x402
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: x402
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  clusterIP: None # headless — StatefulSet manages its own identity
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: x402
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: x402
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: x402
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: x402_gateway
            - name: POSTGRES_USER
              value: x402
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: x402-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
          readinessProbe:
            exec:
              command: ['sh', '-c', 'pg_isready -U x402 -d x402_gateway']
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ['sh', '-c', 'pg_isready -U x402 -d x402_gateway']
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: 10Gi
