version: '3.8'

services:
  gateway:
    build:
      context: ./apps/gateway
      dockerfile: Dockerfile
    container_name: x402-gateway-mainnet
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - API_PREFIX=api/v1
      - STELLAR_NETWORK=mainnet
      - STELLAR_MAINNET_HORIZON_URL=https://horizon.stellar.org
      - STELLAR_MAINNET_SOROBAN_RPC_URL=https://soroban-rpc.stellar.org
      - STELLAR_MAINNET_NETWORK_PASSPHRASE="Public Global Stellar Network ; September 2015"
      - STELLAR_MAINNET_USDC_ISSUER=GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN
      - STELLAR_MAINNET_USDC_ASSET_CODE=USDC
      - STELLAR_CONTRACT_NETWORK=mainnet
      - PRICE_PER_1K_INPUT_TOKENS=0.001
      - PRICE_PER_1K_OUTPUT_TOKENS=0.003
      - MIN_PAYMENT_AMOUNT=0.001
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX_REQUESTS=200
      - LOG_LEVEL=info
    env_file:
      - .env.mainnet
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
    container_name: x402-dashboard-mainnet
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:3000/api/v1
      - NEXT_PUBLIC_STELLAR_NETWORK=mainnet
    env_file:
      - .env.mainnet
    depends_on:
      - gateway
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: x402-postgres-mainnet
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=x402_mainnet
    volumes:
      - postgres_mainnet_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: x402-redis-mainnet
    ports:
      - "6379:6379"
    volumes:
      - redis_mainnet_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_mainnet_data:
  redis_mainnet_data:

networks:
  default:
    name: x402-mainnet-network
