name: Deploy

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  # `gh run list` in the check-ci job reads the Actions API — without
  # `actions: read` the token is rejected with "Resource not accessible".
  actions: read

env:
  PNPM_VERSION: '11.24.0'
  STELLAR_CLI_VERSION: '27.1.0'

jobs:
  check-ci:
    name: Verify CI Passed
    runs-on: ubuntu-latest
    steps:
      - name: Check latest CI run on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONCLUSION=$(gh run list --workflow CI --branch main --limit 1 --json conclusion --jq '.[0].conclusion')
          if [ "$CONCLUSION" != "success" ]; then
            echo "Latest CI run on main: $CONCLUSION — aborting deploy"
            exit 1
          fi
          echo "CI passed on main, proceeding with deploy"

  docker:
    needs: [check-ci]
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    # `secrets` is not available in step-level `if:` expressions, so bridge the
    # presence check through job env — the same pattern deploy_contracts uses
    # for HAS_STELLAR_SECRET. Without it, a release tag with Docker Hub
    # credentials unset dies inside docker/login-action with an opaque
    # authentication error instead of saying what is missing.
    env:
      HAS_DOCKER_CREDENTIALS: ${{ secrets.DOCKER_USERNAME != '' }}
      ALLOW_DEPLOY_SKIP: ${{ vars.ALLOW_DEPLOY_SKIP == 'true' }}
    steps:
      # A missing credential FAILS this job, for the same reason the Vercel
      # workflow does: a release tag is a promise that images were published.
      # Skipping with only a warning meant a tagged release could go green
      # having built and pushed nothing, so the version number implied an
      # artifact that does not exist.
      #
      # Set the repository variable ALLOW_DEPLOY_SKIP=true to opt back into
      # skipping (e.g. a fork with no Docker Hub account). The opt-out is
      # explicit, per-repository and recorded in the run summary, so it can
      # never be mistaken for a real release.
      - name: Docker Hub credentials not configured
        if: env.HAS_DOCKER_CREDENTIALS != 'true'
        run: |
          if [ "${ALLOW_DEPLOY_SKIP}" = 'true' ]; then
            STATUS='skipped (ALLOW_DEPLOY_SKIP=true)'
          else
            STATUS='FAILED — credentials missing'
          fi

          {
            echo "### Docker image push ${STATUS}"
            echo ""
            echo "\`DOCKER_USERNAME\` is not set, so **no release images were built or pushed** for \`$GITHUB_REF_NAME\`."
            echo ""
            echo "Add these repository secrets under *Settings → Secrets and variables → Actions*,"
            echo "then re-run this workflow (or push the tag again):"
            echo ""
            echo "| Secret | Value |"
            echo "| --- | --- |"
            echo "| \`DOCKER_USERNAME\` | Docker Hub account name |"
            echo "| \`DOCKER_PASSWORD\` | Docker Hub access token (not the account password) |"
            echo ""
            echo "To deliberately skip instead of failing, set the repository variable"
            echo "\`ALLOW_DEPLOY_SKIP\` to \`true\`."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${ALLOW_DEPLOY_SKIP}" = 'true' ]; then
            echo "::warning title=Release images skipped::DOCKER_USERNAME is not set and ALLOW_DEPLOY_SKIP=true — no images were pushed for $GITHUB_REF_NAME."
            exit 0
          fi

          echo "::error title=Release images cannot be pushed::DOCKER_USERNAME is not set — no images were pushed for $GITHUB_REF_NAME. See the job summary, or set ALLOW_DEPLOY_SKIP=true to skip deliberately."
          exit 1

      # Every step below repeats the same condition: Actions has no step-group
      # `if:`, and a job-level `if:` cannot read `secrets`, so the gate has to be
      # carried per step. Together they make the job a clean no-op when the
      # credentials are absent.
      #
      # There is deliberately no Node setup here: both images are built inside
      # their own Dockerfiles (FROM node:22-alpine), so the runner's Node version
      # is irrelevant. An earlier `.nvmrc` step wrote an output nothing read.
      - uses: actions/checkout@v4
        if: env.HAS_DOCKER_CREDENTIALS == 'true'

      - name: Set up Docker Buildx
        if: env.HAS_DOCKER_CREDENTIALS == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: env.HAS_DOCKER_CREDENTIALS == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract version
        if: env.HAS_DOCKER_CREDENTIALS == 'true'
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build & push gateway
        if: env.HAS_DOCKER_CREDENTIALS == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.gateway
          push: true
          tags: |
            x402/gateway:latest
            x402/gateway:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push dashboard
        if: env.HAS_DOCKER_CREDENTIALS == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.dashboard
          push: true
          tags: |
            x402/dashboard:latest
            x402/dashboard:${{ steps.version.outputs.VERSION }}
          # Next.js inlines NEXT_PUBLIC_* into the client bundle at BUILD time,
          # so the dashboard's public gateway URL must be baked in here (a
          # runtime ConfigMap/env cannot change it). Set the repository
          # variable NEXT_PUBLIC_GATEWAY_URL to the PUBLIC gateway URL (e.g.
          # https://gateway.example.com); when unset the image falls back to
          # http://localhost:3000 for local use.
          build-args: |
            NEXT_PUBLIC_GATEWAY_URL=${{ vars.NEXT_PUBLIC_GATEWAY_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sbom:
    needs: [check-ci]
    name: Generate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload SBOM as a release asset
    steps:
      - uses: actions/checkout@v4

      - name: Read Node version from .nvmrc
        id: nvm
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nvm.outputs.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # CycloneDX SBOM covering the JS workspace (pnpm-lock.yaml) and the
      # Rust contracts (Cargo.lock). Attached to the release automatically.
      - name: Generate SBOM (CycloneDX JSON)
        uses: anchore/sbom-action@v0
        with:
          path: ./
          format: cyclonedx-json
          output-file: x402-gateway-sbom.cdx.json

      - name: Attach SBOM to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" x402-gateway-sbom.cdx.json --clobber

  deploy_contracts:
    needs: [check-ci]
    name: Deploy & Initialize Soroban Contracts
    runs-on: ubuntu-latest
    # The job commits the freshly deployed contract IDs back to main so the
    # repo's contracts/deployed-addresses.json always reflects the live
    # instances. Requires contents: write for the commit-back step.
    permissions:
      contents: write
    # secrets is not available in step-level `if:`; bridge it via job env so
    # the commit-back step only runs when a deploy actually happened.
    env:
      HAS_STELLAR_SECRET: ${{ secrets.STELLAR_SECRET_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: wasm32v1-none

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/*/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/**/Cargo.toml') }}

      - name: Download Stellar CLI (pre-built)
        run: |
          curl -sL -o /tmp/stellar.tar.gz \
            "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/stellar.tar.gz -C /tmp
          chmod +x /tmp/stellar
          sudo mv /tmp/stellar /usr/local/bin/stellar
          stellar --version

      # Builds → deploys + initializes every contract in one transaction
      # (constructor admin/asset/signers/threshold args are contract-specific)
      # → writes the new IDs to contracts/deployed-addresses.json. Skips
      # gracefully when STELLAR_SECRET_KEY is not set.
      - name: Deploy & initialize contracts
        run: bash scripts/deploy-contracts.sh
        env:
          STELLAR_SECRET_KEY: ${{ secrets.STELLAR_SECRET_KEY }}
          STELLAR_NETWORK: testnet
          # Optional overrides:
          # STELLAR_RPC_URL: https://soroban-testnet.stellar.org
          # STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
          # USDC_ISSUER: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
          # MULTISIG_SIGNERS: GABC...,GDEF...   (defaults to the admin key)
          # MULTISIG_THRESHOLD: 2               (default 1)

      # Persist the freshly deployed addresses to the repository so the next
      # gateway build starts from the new contract IDs instead of stale
      # hardcoded defaults. [skip ci] avoids re-triggering CI on the commit.
      #
      # The script above already modified contracts/deployed-addresses.json in
      # the working tree, so copy it aside, switch to latest main, then put it
      # back — this avoids "local changes would be overwritten by checkout"
      # when main has advanced past the tag that triggered this workflow.
      - name: Commit deployed addresses back to main
        if: env.HAS_STELLAR_SECRET == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          cp contracts/deployed-addresses.json /tmp/deployed-addresses.json
          # -f guarantees the switch succeeds even though the addresses file
          # is modified in the working tree; we restore it from /tmp below.
          git checkout -f -B deploy-contracts origin/main
          cp /tmp/deployed-addresses.json contracts/deployed-addresses.json
          git add contracts/deployed-addresses.json
          if git diff --cached --quiet; then
            echo "No address changes to commit — deployed IDs match the repo."
          else
            git commit -m "chore(contracts): persist deployed contract addresses [skip ci]"
            git push origin deploy-contracts:main
          fi
